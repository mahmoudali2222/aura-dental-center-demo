
name: Deploy Aura Dental Center

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract frontend ZIP
        run: |
          mkdir site
          unzip -q aura-dental-center-github-pages-ready.zip -d site

      - name: Install dependencies and build
        working-directory: site
        run: |
          npm ci
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
          
      - name: Prepare GitHub Pages
        run: cp site/dist/index.html site/dist/404.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
